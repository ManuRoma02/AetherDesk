<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for banner preview -->
    <linearGradient id="logoCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#131a29"/>
    </linearGradient>

    <!-- Electric Sky Cyan Beam -->
    <linearGradient id="logoCyanBeam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Telepresence Laser Data Link -->
    <linearGradient id="logoLaserBridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Precision Laser Glow -->
    <filter id="logoLaserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Bento Canvas Background -->
  <rect width="940" height="220" rx="20" fill="url(#logoCanvas)" stroke="#252b3e" stroke-width="1.5"/>

  <!-- Left Icon Mark (Monolithic Squircle scaled down) -->
  <g transform="translate(32, 26) scale(0.328)">
    <!-- Base Squircle -->
    <rect x="16" y="16" width="480" height="480" rx="108" fill="#131a29" stroke="#252b3e" stroke-width="4"/>
    <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>

    <!-- Subtle Tech Grid -->
    <g opacity="0.08" stroke="#38bdf8" stroke-width="2">
      <line x1="80" y1="20" x2="80" y2="492"/>
      <line x1="256" y1="20" x2="256" y2="492"/>
      <line x1="432" y1="20" x2="432" y2="492"/>
      <line x1="20" y1="168" x2="492" y2="168"/>
      <line x1="20" y1="296" x2="492" y2="296"/>
    </g>

    <!-- Ambient Core Glow -->
    <circle cx="256" cy="270" r="140" fill="#38bdf8" opacity="0.16" filter="blur(30px)"/>

    <!-- Monogram Legs -->
    <path d="M 164 376 L 228 152 Q 236 128 256 128 Q 276 128 284 152 L 348 376"
          fill="none" stroke="url(#logoCyanBeam)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoLaserGlow)"/>

    <!-- Laser Bridge -->
    <g filter="url(#logoLaserGlow)">
      <path d="M 132 296 L 380 296" stroke="url(#logoLaserBridge)" stroke-width="20" stroke-linecap="round"/>
      <polygon points="256,260 288,296 256,332 224,296" fill="#f8fafc"/>
      <polygon points="256,268 280,296 256,324 232,296" fill="#38bdf8"/>
    </g>

    <!-- Beacons -->
    <circle cx="132" cy="296" r="10" fill="#10b981" filter="url(#logoLaserGlow)"/>
    <circle cx="380" cy="296" r="10" fill="#38bdf8" filter="url(#logoLaserGlow)"/>
    <circle cx="256" cy="128" r="8" fill="#ffffff" filter="url(#logoLaserGlow)"/>
  </g>

  <!-- Typographic Lockup: AETHER DESK -->
  <text x="228" y="106" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="58" letter-spacing="-0.02em" fill="#f8fafc">
    AETHER<tspan fill="#38bdf8">DESK</tspan>
  </text>

  <!-- Tagline Pill Badge -->
  <rect x="230" y="128" width="186" height="28" rx="6" fill="#1a2336" stroke="#252b3e" stroke-width="1"/>
  <text x="242" y="146" font-family="'JetBrains Mono', 'Cascadia Code', monospace" font-weight="700" font-size="11" letter-spacing="1.5" fill="#38bdf8">
    SOVEREIGN REMOTE
  </text>

  <!-- Feature Telemetry Metadata -->
  <text x="432" y="146" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" font-size="14" fill="#94a3b8">
    Zero Latency • Unattended Access • E2EE AES-GCM
  </text>
</svg>

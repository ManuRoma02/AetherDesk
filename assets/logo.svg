<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for banner preview -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#121524"/>
    </linearGradient>

    <!-- Beam Primary Gradient -->
    <linearGradient id="aetherGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Data Link Gradient -->
    <linearGradient id="linkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Optional Dark Canvas Background -->
  <rect width="920" height="220" rx="24" fill="url(#logoBg)"/>

  <!-- Left Icon Mark (Scaled down squircle) -->
  <g transform="translate(30, 25) scale(0.33)">
    <!-- Squircle Base -->
    <rect x="16" y="16" width="480" height="480" rx="108" fill="#141726" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4"/>

    <!-- Subtle Tech Grid Accent -->
    <g opacity="0.1" stroke="#ffffff" stroke-width="1">
      <line x1="80" y1="16" x2="80" y2="496"/>
      <line x1="256" y1="16" x2="256" y2="496"/>
      <line x1="432" y1="16" x2="432" y2="496"/>
      <line x1="16" y1="160" x2="496" y2="160"/>
      <line x1="16" y1="352" x2="496" y2="352"/>
    </g>

    <!-- Glowing Core Shape -->
    <circle cx="256" cy="256" r="120" fill="#38bdf8" opacity="0.15" filter="blur(30px)"/>

    <!-- Dual-Portal Monogram A -->
    <path d="M 164 376 L 228 152 Q 236 124 256 124 Q 276 124 284 152 L 348 376"
          fill="none" stroke="url(#aetherGradient)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)"/>

    <!-- Horizontal Bridge -->
    <g filter="url(#logoGlow)">
      <path d="M 130 295 L 382 295" stroke="url(#linkGradient)" stroke-width="20" stroke-linecap="round"/>
      <polygon points="256,260 286,295 256,330 226,295" fill="#ffffff"/>
      <polygon points="256,268 278,295 256,322 234,295" fill="#38bdf8"/>
    </g>
    <circle cx="130" cy="295" r="9" fill="#10b981"/>
    <circle cx="382" cy="295" r="9" fill="#38bdf8"/>
    <circle cx="256" cy="124" r="8" fill="#ffffff"/>
  </g>

  <!-- Typography: AETHER DESK -->
  <!-- Brand Name Primary -->
  <text x="235" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="62" letter-spacing="3" fill="#f8fafc">
    AETHER<tspan fill="#38bdf8">DESK</tspan>
  </text>

  <!-- Subtitle Tagline Badge -->
  <rect x="235" y="132" width="226" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="247" y="149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', monospace" font-weight="700" font-size="11" letter-spacing="2" fill="#38bdf8">
    ULTRA-LIGHT REMOTE
  </text>

  <text x="472" y="149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-weight="500" font-size="14" fill="#94a3b8">
    Zero Bloat • Unattended Access • E2EE
  </text>
</svg>

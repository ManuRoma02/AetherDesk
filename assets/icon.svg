<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="50%" stop-color="#161926"/>
      <stop offset="100%" stop-color="#090a10"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Beam Primary Gradient (Aether Flow) -->
    <linearGradient id="aetherBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Emerald Success Beam -->
    <linearGradient id="emeraldBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Core Laser Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Canvas Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Tech Grid Accent -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="16" x2="80" y2="496"/>
    <line x1="160" y1="16" x2="160" y2="496"/>
    <line x1="256" y1="16" x2="256" y2="496"/>
    <line x1="352" y1="16" x2="352" y2="496"/>
    <line x1="432" y1="16" x2="432" y2="496"/>
    <line x1="16" y1="160" x2="496" y2="160"/>
    <line x1="16" y1="256" x2="496" y2="256"/>
    <line x1="16" y1="352" x2="496" y2="352"/>
  </g>

  <!-- Ambient Internal Glow -->
  <circle cx="256" cy="256" r="140" fill="#38bdf8" opacity="0.12" filter="blur(40px)"/>
  <circle cx="256" cy="256" r="80" fill="#818cf8" opacity="0.18" filter="blur(30px)"/>

  <!-- Logo Mark: The Dual-Portal "A" Monogram -->
  <!-- Left Screen Portal (Host / Sender) -->
  <path d="M 160 380 L 220 150 Q 230 115 256 115 Q 282 115 292 150 L 352 380 Q 358 402 340 402 L 305 402 Q 292 402 286 385 L 272 335 L 240 335 L 226 385 Q 220 402 207 402 L 172 402 Q 154 402 160 380 Z"
        fill="none" stroke="url(#aetherBeam)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

  <!-- Illuminated Hero Monogram A with Laser Focus -->
  <path d="M 164 376 L 228 152 Q 236 124 256 124 Q 276 124 284 152 L 348 376"
        fill="none" stroke="url(#aetherBeam)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- High-Speed Ethereal Horizontal Bridge (Zero-Latency Data Link) -->
  <g filter="url(#glow)">
    <!-- Main Cross Bridge -->
    <path d="M 130 295 L 382 295" stroke="url(#emeraldBeam)" stroke-width="20" stroke-linecap="round"/>
    <!-- Central Energy Diamond -->
    <polygon points="256,260 286,295 256,330 226,295" fill="#ffffff" opacity="0.95"/>
    <polygon points="256,268 278,295 256,322 234,295" fill="#38bdf8"/>
  </g>

  <!-- Optical Energy Beacons (Nodes) -->
  <circle cx="130" cy="295" r="9" fill="#10b981" filter="url(#glow)"/>
  <circle cx="382" cy="295" r="9" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="256" cy="124" r="8" fill="#ffffff" filter="url(#glow)"/>
</svg>

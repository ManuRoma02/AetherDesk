<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Bento Canvas Gradient (No pure black, no purple slop) -->
    <linearGradient id="bentoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#131a29"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <!-- Precision Hairline Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#252b3e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Electric Sky Cyan Beam -->
    <linearGradient id="cyanBeam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Telepresence Laser Data Link -->
    <linearGradient id="laserBridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Precision Laser Glow -->
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Ambient Core Dispersion -->
    <filter id="ambientCore" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <!-- 1. Apple Squircle Base (Full Bleed Depth) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bentoBg)" stroke="#252b3e" stroke-width="2.5"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="url(#rimGrad)" stroke-width="1.5"/>

  <!-- 2. Subtle Precision Grid (Technical Avionics Texture) -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1.2">
    <line x1="80" y1="20" x2="80" y2="492"/>
    <line x1="168" y1="20" x2="168" y2="492"/>
    <line x1="256" y1="20" x2="256" y2="492"/>
    <line x1="344" y1="20" x2="344" y2="492"/>
    <line x1="432" y1="20" x2="432" y2="492"/>
    <line x1="20" y1="128" x2="492" y2="128"/>
    <line x1="20" y1="216" x2="492" y2="216"/>
    <line x1="20" y1="296" x2="492" y2="296"/>
    <line x1="20" y1="384" x2="492" y2="384"/>
  </g>

  <!-- 3. Ambient Internal Dispersion Aura -->
  <circle cx="256" cy="270" r="130" fill="#38bdf8" opacity="0.14" filter="url(#ambientCore)"/>
  <circle cx="256" cy="296" r="60" fill="#10b981" opacity="0.16" filter="url(#ambientCore)"/>

  <!-- 4. Monolithic Dual-Portal 'A' Legs -->
  <!-- Ambient Shadow Pass -->
  <path d="M 164 376 L 228 152 Q 236 128 256 128 Q 276 128 284 152 L 348 376"
        fill="none" stroke="#0284c7" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>

  <!-- Core Precision Pylon Legs -->
  <path d="M 164 376 L 228 152 Q 236 128 256 128 Q 276 128 284 152 L 348 376"
        fill="none" stroke="url(#cyanBeam)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#laserGlow)"/>

  <!-- 5. Horizontal Photon Laser Bridge (Data Pipeline) -->
  <g filter="url(#laserGlow)">
    <path d="M 132 296 L 380 296" stroke="url(#laserBridge)" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Central Faceted Refractive Diamond Prism -->
    <polygon points="256,260 288,296 256,332 224,296" fill="#f8fafc"/>
    <polygon points="256,268 280,296 256,324 232,296" fill="#38bdf8"/>
  </g>

  <!-- 6. Optical Energy Beacon Nodes -->
  <!-- Left Telemetry Node (Host Sender / Emerald) -->
  <circle cx="132" cy="296" r="10" fill="#10b981" filter="url(#laserGlow)"/>
  <circle cx="132" cy="296" r="4.5" fill="#ffffff"/>

  <!-- Right Telemetry Node (Client Receiver / Sky Cyan) -->
  <circle cx="380" cy="296" r="10" fill="#38bdf8" filter="url(#laserGlow)"/>
  <circle cx="380" cy="296" r="4.5" fill="#ffffff"/>

  <!-- Apex Gateway Node (Apex / Polar White) -->
  <circle cx="256" cy="128" r="8" fill="#ffffff" filter="url(#laserGlow)"/>
</svg>

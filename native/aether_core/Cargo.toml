[package]
name = "aether_core"
version = "0.2.0"
edition = "2021"
authors = ["AetherDesk Authors"]
license = "MIT OR Apache-2.0"
description = "High-performance native real-time engine for AetherDesk (DXGI Desktop Duplication, MF H.264, WebRTC transport)"

[lib]
name = "aether_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Standard Windows APIs (MIT / Apache-2.0 clean-room)
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

# Asynchronous runtime & serialization
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography (Standard RFC algorithms)
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"

# WebRTC & Realtime transport
webrtc = "0.11"
bytes = "1.5"
